version: '3.8'

services:
  # Serviço do Banco de Dados
  db:
    image: postgres:14.17-alpine
    container_name: blog_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: blog_db
    ports:
      - '5432:5432' 
    volumes:
      - postgres_data:/var/lib/postgresql/data 
  # Serviço de Interface Gráfica para o Banco (Opcional mas útil)
  # É como um "Workbench" ou "DBeaver" que roda no navegador
  pgadmin:
    image: dpage/pgadmin4
    container_name: blog_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  postgres_data: